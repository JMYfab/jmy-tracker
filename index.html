<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://nuugxlkvqfnesvxkctaj.supabase.co; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order | JMY</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="enhancements.css">
  <link rel="stylesheet" href="brand-lockup.css">
</head>
<body>
  <main class="page-shell">
    <section class="tracker-card" aria-labelledby="page-title">
      <div class="brand-lockup"><img class="brand-logo" src="email-logo.jpg" alt="We Grow You"><span class="brand-name">JMY Fabrication</span></div>
      <p class="eyebrow">Order tracker</p>
      <h1 id="page-title">Your private order tracker</h1>
      <p class="intro">Open the private tracking link from your JMY Fabrication email to see your order status.</p>
      <section id="message" class="message" aria-live="polite" hidden></section>
      <section id="result" class="order-result" aria-live="polite" hidden>
        <div class="result-heading"><p class="eyebrow">Order details</p><span id="status-badge" class="status-badge"></span></div>
        <dl class="order-details">
          <div><dt>Order number</dt><dd id="result-order-number"></dd></div>
          <div><dt id="fulfillment-label">Estimated shipping date</dt><dd id="result-fulfillment-date"></dd></div>
          <div id="tracking-row" hidden><dt>Tracking number</dt><dd><a id="tracking-link" target="_blank" rel="noopener noreferrer"></a></dd></div>
        </dl>
        <p id="status-note" class="status-note"></p>
      </section>
    </section>
    <footer class="support">
      <p>Need help with your order?</p>
      <p><a href="mailto:WeGrowYou@jmyfabrication.com">WeGrowYou@jmyfabrication.com</a></p>
      <p><a href="tel:+13157679062">315-767-9062</a></p>
    </footer>
  </main>
  <script src="supabase-config.js"></script>
  <script src="secure-tracker.js?v=20260831-private-link"></script>
</body>
</html>
